<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/pictures/login.jpg">
  <script src="../language.js" defer></script>
  <title data-i18n="login.title">Login | Belle &amp; Co.</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../footer.css">
  <script src="../auth.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-panel" aria-labelledby="form-title">
      <form id="login-form">
        <h1 id="form-title" data-i18n="login.heading">Login</h1>
        <p data-i18n="login.intro">Log in with your existing account.</p>
        <label for="login-email" data-i18n="login.email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="Email" data-i18n-placeholder="login.email" autocomplete="email" required>
        <label for="login-password" data-i18n="login.password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Password" data-i18n-placeholder="login.password" autocomplete="current-password" required>
        <button type="submit" data-i18n="login.submit">Log in</button>
        <p class="switch-copy"><span data-i18n="login.noAccount">Don't have an account yet?</span> <button class="text-button" type="button" data-show="signup" data-i18n="login.create">Create account</button></p>
      </form>

      <form id="signup-form" hidden>
        <h1 data-i18n="login.createHeading">Create an account</h1>
        <p data-i18n="login.signupIntro">Create your free account.</p>
        <label for="signup-name" data-i18n="login.name">Name</label>
        <input id="signup-name" name="name" type="text" placeholder="Name" data-i18n-placeholder="login.name" autocomplete="name" required>
        <label for="signup-email" data-i18n="login.email">Email</label>
        <input id="signup-email" name="email" type="email" placeholder="Email" data-i18n-placeholder="login.email" autocomplete="email" required>
        <label for="signup-password" data-i18n="login.password">Password</label>
        <input id="signup-password" name="password" type="password" placeholder="Password" data-i18n-placeholder="login.password" autocomplete="new-password" minlength="8" required>
        <button type="submit" data-i18n="login.signupSubmit">Create account</button>
        <p class="switch-copy"><span data-i18n="login.hasAccount">Already have an account?</span> <button class="text-button" type="button" data-show="login" data-i18n="login.switchLogin">Log in</button></p>
      </form>
      <p id="form-message" role="status" aria-live="polite"></p>
      <a class="home-link" href="../html/index.html" data-i18n="login.back">Back to shop</a>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div><a class="footer-brand" href="../html/index.html">Belle &amp; Co.</a><p class="footer-copy" data-i18n="footer.tagline">Thoughtful finds for every day.</p></div>
      <p class="footer-rights">© <span data-current-year></span> Belle &amp; Co. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </div>
  </footer>
</body>
</html>
