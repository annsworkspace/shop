<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="wishlist.css">
    <link rel="stylesheet" href="../footer.css">
    <link rel="stylesheet" href="../toast.css">
    <link rel="icon" href="/pictures/wishlist.jpg">
    <script src="../language.js" defer></script>
    <script src="../list-page.js" defer></script>
    <title data-i18n="wishlist.title">Wishlist | Belle &amp; Co.</title>
</head>
<body>
    <main class="list-page" data-list-page="wishlist">
        <h1 data-i18n="wishlist.heading">Wishlist</h1>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <div><a class="footer-brand" href="../html/index.html">Belle &amp; Co.</a><p class="footer-copy" data-i18n="footer.tagline">Thoughtful finds for every day.</p></div>

        </div>
    </footer>

</html>
